# Optional administrator settings for /boot/config/plugins/ugreen-dxp4800gt-leds/settings.cfg
# The defaults match a four-bay DXP4800 GT with ATA ports 1 through 4.
# No hostnames, disk serial numbers, MAC addresses, or IP addresses are needed.

POWER_COLOR='255 255 255'
POWER_BRIGHTNESS=180
NETWORK_INTERFACE=auto
NETWORK_BRIGHTNESS=180
DISK_COLOR='255 255 255'
DISK_BRIGHTNESS=180
DISK_ATA_PORTS=(1 2 3 4)
POLL_INTERVAL=0.5
REFRESH_INTERVAL=15
